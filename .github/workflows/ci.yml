name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Architecture rules
        run: npm run lint:architecture

      - name: Tests
        run: npm test

      # Anonymous mode runs a local Convex backend, so this needs no account or secrets.
      - name: Convex generated code is up to date
        env:
          CONVEX_AGENT_MODE: anonymous
        run: |
          npx convex dev --once
          if [ -n "$(git status --porcelain -- convex/_generated)" ]; then
            git status --porcelain -- convex/_generated
            echo "::error::convex/_generated is stale. Run 'CONVEX_AGENT_MODE=anonymous npx convex dev --once' and commit the result."
            exit 1
          fi

      - name: Kotlin models are up to date
        run: |
          npm run codegen
          if [ -n "$(git status --porcelain -- shared/src/commonMain/kotlin/net/neednot/renttracker/model)" ]; then
            git status --porcelain -- shared/src/commonMain/kotlin/net/neednot/renttracker/model
            echo "::error::Kotlin models are stale. Run 'npm run codegen' and commit the result."
            exit 1
          fi

      - name: Workers bundle
        run: |
          for worker in auth-worker email-worker backup-worker; do
            (cd "$worker" && npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/$worker")
          done

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0"'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, lint and test
        run: ./gradlew build --console=plain

  ios:
    name: iOS compile
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - uses: gradle/actions/setup-gradle@v6

      - name: Link framework and run tests
        run: >-
          ./gradlew --console=plain
          :shared:linkDebugFrameworkIosArm64
          :shared:linkDebugFrameworkIosSimulatorArm64
          :shared:iosSimulatorArm64Test
